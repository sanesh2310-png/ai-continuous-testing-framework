name: continuous-testing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - name: Dependency installation
        run: pip install -r requirements.txt
      - name: Application build (Docker image)
        run: docker build -t shopeasy:${{ github.sha }} .

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: PyTest API tests
        run: pytest tests/api -q --junitxml=reports/api-junit.xml
      - name: Start app for Newman
        run: |
          python -m shop.app &
          for i in $(seq 1 20); do curl -sf localhost:5000/api/health && break || sleep 1; done
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Newman (Postman collection)
        run: npx --yes newman run postman/shopeasy.postman_collection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: api-reports, path: reports/}

  ui-tests:
    name: UI Automation Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Selenium UI tests (headless Chrome is preinstalled on the runner)
        run: pytest tests/ui -q --junitxml=reports/ui-junit.xml --alluredir=reports/allure-results
        env:
          RUN_DIR: reports
      - name: AI failure summary
        if: failure()
        run: python -m ai.summarize_failures reports/ui-junit.xml
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ui-reports, path: reports/}

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]          # skipped ("Blocked") if either test job fails
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; echo "Deploy triggered";
          else echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping real deploy (tests passed)"; fi
