<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ShopEasy{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>ShopEasy</h1>
    {% if session.get('email') %}
    <nav>
      <a id="products-link" href="{{ url_for('products') }}">Products</a>
      <a id="cart-link" href="{{ url_for('cart') }}">Cart (<span id="cart-count">{{ cart_count }}</span>)</a>
      <span id="welcome">{{ session['email'] }}</span>
      <a id="logout-link" href="{{ url_for('logout') }}">Logout</a>
    </nav>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}" id="flash-{{ category }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
